.car-dots i{width:6px;height:6px;border-radius:50%;background:#4a3231;display:block;transition:all .2s}
.car-dots i.on{background:var(--g1);width:18px;border-radius:4px}
</style>

var PRECOS_PADRAO = [['Design com henna', 40, 0], ['Design personalizado', 30, 0], ['Microblading', 280, 0], ['Microlabial', 0, 1], ['Spa das sobrancelhas', 65, 0], ['Brow lamination', 75, 0], ['Lamination + henna', 90, 0], ['Hidra gloss', 80, 0], ['Spa labial', 40, 0], ['Epilação facial', 60, 0], ['Buço', 15, 0]];

var POLL_MS = 15000;
/* ===== FIM DA CONFIGURACAO ===== */
var $app = document.getElementById('app');
var pad = function(n){ return String(n).padStart(3, '0'); };
function dia(){ return new Intl.DateTimeFormat('en-CA', {timeZone: 'America/Fortaleza'}).format(new Date()).replace(/-/g, ''); }
function topico(){ return 'leidfila-' + SEGREDO + '-' + dia(); }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function hhmm(d){ return d.toLocaleTimeString('pt-BR', {hour: '2-digit', minute: '2-digit'}); }
function codigo(){ var a = new Uint8Array(9); crypto.getRandomValues(a); return Array.from(a, function(b){ return b.toString(36).padStart(2, '0'); }).join('').slice(0, 12); }
async function sha(txt){
var b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('leidfila|' + txt));
return Array.from(new Uint8Array(b), function(x){ return x.toString(16).padStart(2, '0'); }).join('');
}
function comTimeout(url, opts, ms){
var c = new AbortController(); var t = setTimeout(function(){ c.abort(); }, ms || 8000);
opts = opts || {}; opts.signal = c.signal;
return fetch(url, opts).finally(function(){ clearTimeout(t); });
}
function b64e(buf){ var b = new Uint8Array(buf), s = ''; for (var i = 0; i < b.length; i++) s += String.fromCharCode(b[i]); return btoa(s); }
function b64d(t){ var s = atob(t), b = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) b[i] = s.charCodeAt(i); return b; }
function msgAssinada(topico, q, k, n){ return topico + '|' + q + '|' + k + '|' + (n === undefined ? '' : n); }
var _pub = null, _vc = {};
function cfg(){ try { return CHAVE_DONA ? JSON.parse(CHAVE_DONA) : null; } catch (e) { return null; } }
async function chavePublica(){ if (_pub) return _pub; var c = cfg(); if (!c) return null; _pub = await crypto.subtle.importKey('jwk', c.pub, {name: 'ECDSA', namedCurve: 'P-256'}, false, ['verify']); return _pub; }
async function verificar(e, topico){
var key = e.g + '|' + msgAssinada(topico, e.q, e.k, e.n);
if (_vc[key] !== undefined) return _vc[key];
var ok = false;
try { var pk = await chavePublica(); if (pk && typeof e.g === 'string') ok = await crypto.subtle.verify({name: 'ECDSA', hash: 'SHA-256'}, pk, b64d(e.g), new TextEncoder().encode(msgAssinada(topico, e.q, e.k, e.n))); } catch (x) {}
_vc[key] = ok; return ok;
}
async function chaveDeSenha(codigo, salt, iters){
var base = await crypto.subtle.importKey('raw', new TextEncoder().encode('leidfila-dona|' + codigo), 'PBKDF2', false, ['deriveKey']);
return crypto.subtle.deriveKey({name: 'PBKDF2', salt: salt, iterations: iters, hash: 'SHA-256'}, base, {name: 'AES-GCM', length: 256}, false, ['encrypt', 'decrypt']);
}
async function gerarChave(codigo){
var kp = await crypto.subtle.generateKey({name: 'ECDSA', namedCurve: 'P-256'}, true, ['sign', 'verify']);
var priv = await crypto.subtle.exportKey('jwk', kp.privateKey), pub = await crypto.subtle.exportKey('jwk', kp.publicKey);
var salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12)), it = 600000;
var k = await chaveDeSenha(codigo, salt, it);
var ct = await crypto.subtle.encrypt({name: 'AES-GCM', iv: iv}, k, new TextEncoder().encode(JSON.stringify(priv)));
return JSON.stringify({pub: {kty: pub.kty, crv: pub.crv, x: pub.x, y: pub.y}, blob: {n: it, s: b64e(salt), i: b64e(iv), c: b64e(ct)}});
}
async function abrirChave(codigo){
var b = cfg().blob, k = await chaveDeSenha(codigo, b64d(b.s), b.n);
var pt = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64d(b.i)}, k, b64d(b.c));
return new TextDecoder().decode(pt);
}
async function assinar(ev){
var jwk = JSON.parse(localStorage.getItem('leidfila-chave'));
var key = await crypto.subtle.importKey('jwk', jwk, {name: 'ECDSA', namedCurve: 'P-256'}, false, ['sign']);
var sig = await crypto.subtle.sign({name: 'ECDSA', hash: 'SHA-256'}, key, new TextEncoder().encode(msgAssinada(Feed.topico || topico(), ev.q, ev.k, ev.n)));
ev.g = b64e(sig); return ev;
}
var Feed = {
eventos: [], bruto: [], seq: 0, ver: 0, vistos: {}, ouvintes: [], es: null, topico: '', ok: false, ultima: null, pollTimer: null,
ouvir: function(fn){ this.ouvintes.push(fn); },
limparOuvintes: function(){ this.ouvintes = []; },
avisar: function(){ var s = this; s.ouvintes.forEach(function(f){ try { f(); } catch (e) {} }); },
ingerir: function(m){
if (!m || m.event !== 'message' || this.vistos[m.id]) return false;
this.vistos[m.id] = 1;
try { var e = JSON.parse(m.message); if (e && e.k) { e._t = m.time || 0; this.bruto.push(e); return true; } } catch (x) {}
return false;
},
refazer: async function(){
var s = this, v = ++s.ver, lista = s.bruto.slice(), out = [], seq = 0, top = s.topico;
for (var i = 0; i < lista.length; i++) {
var e = lista[i];
if (e.k === 'c') { out.push(e); continue; }
if (e.k === 'q') { if (typeof e.sec === 'string' && e.sec.length > 8 && e.sec.length < 80) { var hq = (await sha(e.sec)).slice(0, 32); out.push({k: 'q', h: hq, _t: e._t}); } continue; }
if (['n', 'd', 'x', 'r', 'p', 'u', 's'].indexOf(e.k) < 0) continue;
if (e.k === 's' && (typeof e.n !== 'string' || e.n.length > 3000)) continue;
if (e.q !== seq) continue;
if (!(await verificar(e, top))) continue;
seq++; out.push(e);
}
if (v !== s.ver) return s.eventos;
s.eventos = out; s.seq = seq; s.avisar(); return out;
},
iniciar: function(){
var s = this;
if (s.es && s.topico === topico()) return;
s.parar();
s.topico = topico(); s.eventos = []; s.bruto = []; s.seq = 0; s.vistos = {}; s.ok = false;
s.ler();
try {
s.es = new EventSource(NTFY + '/' + s.topico + '/sse?since=all');
s.es.onmessage = function(ev){ try { if (s.ingerir(JSON.parse(ev.data))) { s.ultima = new Date(); s.ok = true; s.refazer(); } } catch (x) {} };
s.es.onopen = function(){ s.ok = true; s.avisar(); };
s.es.onerror = function(){ s.ok = false; s.avisar(); };
} catch (e) {}
s.pollTimer = setInterval(function(){ s.ler(); }, POLL_MS);
},
parar: function(){ if (this.es) { this.es.close(); this.es = null; } if (this.pollTimer) { clearInterval(this.pollTimer); this.pollTimer = null; } },
ler: async function(){
var s = this, t = s.topico || topico();
try {
var r = await comTimeout(NTFY + '/' + t + '/json?poll=1&since=all', null, 8000);
if (!r.ok) throw new Error('ler ' + r.status);
var txt = await r.text(), lista = [], vistos = {};
txt.split('\n').forEach(function(l){ if (!l.trim()) return; try { var m = JSON.parse(l); if (m.event !== 'message' || vistos[m.id]) return; var e = JSON.parse(m.message); if (e && e.k) { vistos[m.id] = 1; e._t = m.time || 0; lista.push(e); } } catch (x) {} });
if (t === s.topico) { s.bruto = lista; s.vistos = vistos; s.ok = true; s.ultima = new Date(); return await s.refazer(); }
return lista.filter(function(e){ return e.k === 'c'; });
} catch (e) { s.ok = false; s.avisar(); throw e; }
}
};
async function enviar(ev){
var r = await comTimeout(NTFY + '/' + topico(), {method: 'POST', body: JSON.stringify(ev)}, 8000);
if (!r.ok) throw new Error('enviar ' + r.status);
}
document.addEventListener('visibilitychange', function(){ if (!document.hidden) { Feed.iniciar(); Feed.ler().catch(function(){}); } });
function limparLista(t){
try { var a = JSON.parse(t); if (!Array.isArray(a) || a.length > 40) return null; var out = [];
a.forEach(function(x){ if (Array.isArray(x) && typeof x[0] === 'string' && x[0].length <= 60) out.push([x[0], Math.max(0, Math.min(100000, Number(x[1]) || 0)), x[2] ? 1 : 0]); });
return out; } catch (e) { return null; }
}
function listaPublicada(eventos){ var l = null; eventos.forEach(function(e){ if (e.k === 's') l = limparLista(e.n); }); return l; }
function blocoServicos(eventos){
var l = listaPublicada(eventos) || PRECOS_PADRAO, cards = [];
l.forEach(function(x){
if (x[1] > 0) cards.push('<div class="car-card"><div class="car-star">✦</div><div class="car-nome">' + esc(x[0]) + '</div><div class="car-linha"></div><div class="car-preco">' + brl(x[1]) + '</div><div class="car-sub">valor</div></div>');
else if (x[2]) cards.push('<div class="car-card"><div class="car-star">✦</div><div class="car-nome">' + esc(x[0]) + '</div><div class="car-linha"></div><div class="car-wa">valor pelo WhatsApp</div><a class="car-link" href="https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent('Oi! Quero saber o valor e agendar: ' + x[0]) + '">Perguntar no WhatsApp</a></div>');
});
if (!cards.length) return '';
return '<h2>Serviços e valores</h2><div class="car-track">' + cards.join('') + '</div>' + (cards.length > 1 ? '<div class="car-nav"><button class="car-b" data-d="-1" aria-label="Anterior">&#8249;</button><div class="car-dots">' + cards.map(function(){ return '<i></i>'; }).join('') + '</div><button class="car-b" data-d="1" aria-label="Próximo">&#8250;</button></div>' : '');
}
function atualizarServs(el){
if (!el) return; var h = blocoServicos(Feed.eventos); if (el.getAttribute('data-h') === h) return;
el.setAttribute('data-h', h); el.innerHTML = h;
var tr = el.querySelector('.car-track'); if (!tr) return;
var dots = el.querySelectorAll('.car-dots i'), bs = el.querySelectorAll('.car-b');
function pos(){ var c = tr.children[0]; if (!c) return 0; var w = c.offsetWidth + 12; return Math.max(0, Math.min(tr.children.length - 1, Math.round(tr.scrollLeft / w))); }
function marca(){ var i = pos(); dots.forEach(function(d, k){ d.className = k === i ? 'on' : ''; }); if (bs.length) { bs[0].disabled = i === 0; bs[1].disabled = i === tr.children.length - 1; } }
tr.addEventListener('scroll', marca, {passive: true}); marca();
bs.forEach(function(b){ b.onclick = function(){ var d = parseInt(b.getAttribute('data-d'), 10), c = tr.children[0]; tr.scrollBy({left: d * (c.offsetWidth + 12), behavior: 'smooth'}); }; });
}
function derivar(eventos){
var ini = 0;
eventos.forEach(function(e, i){ if (e.k === 'r') ini = i + 1; });
eventos = eventos.slice(ini);
var vistos = {}, claims = [], removidos = {}, chamados = {}, atual = null, chamadas = [], cancel = {}, pausada = false, lista = null;
eventos.forEach(function(e){ if (e.k === 'c' && !vistos[e.id]) { vistos[e.id] = 1; claims.push(e); } });
eventos.forEach(function(e){
if (e.k === 'x') removidos[e.n] = 1;
if (e.k === 'n') { chamados[e.n] = 1; atual = e.n; chamadas.push(e._t || 0); }
if (e.k === 'd') atual = null;
if (e.k === 'q') cancel[e.h] = 1;
if (e.k === 's') lista = limparLista(e.n);
if (e.k === 'p') pausada = true;
if (e.k === 'u') pausada = false;
});
var tickets = claims.map(function(c, i){
var n = i + 1;
var st = removidos[n] ? 'removida' : (cancel[c.id] && atual !== n && !chamados[n]) ? 'cancelada' : atual === n ? 'atual' : chamados[n] ? 'atendida' : 'espera';
return {n: n, id: c.id, s: c.s, st: st};
});
/* tempo medio entre chamadas (so intervalos de ate 60 min) */
var soma = 0, qtd = 0;
for (var i = 1; i < chamadas.length; i++) { var dt = chamadas[i] - chamadas[i - 1]; if (dt > 20 && dt < 3600) { soma += dt; qtd++; } }
return {tickets: tickets, atual: atual, total: claims.length, media: qtd >= 2 ? soma / qtd : 0, pausada: pausada, lista: lista};
}
function resumo(eventos){
var segs = [[]]; eventos.forEach(function(e){ if (e.k === 'r') segs.push([]); else segs[segs.length - 1].push(e); });
var por = {}, tot = {p: 0, a: 0, x: 0, e: 0}, soma = 0, qtd = 0;
segs.forEach(function(seg){
var d = derivar(seg);
d.tickets.forEach(function(t){
var o = por[t.s] = por[t.s] || {p: 0, a: 0, x: 0}; o.p++; tot.p++;
if (t.st === 'atendida' || t.st === 'atual') { o.a++; tot.a++; } else if (t.st === 'removida' || t.st === 'cancelada') { o.x++; tot.x++; } else tot.e++;
});
if (d.media) { soma += d.media; qtd++; }
});
return {por: por, tot: tot, media: qtd ? soma / qtd : 0};
}
function minhaSenha(){ try { var v = JSON.parse(localStorage.getItem('leidfila-minha') || 'null'); return v && v.dia === dia() ? v : null; } catch (e) { return null; } }
function guardarSenha(n, id, seg){ try { localStorage.setItem('leidfila-minha', JSON.stringify({dia: dia(), n: n, id: id, seg: seg})); } catch (e) {} }

var vistos = {}, lista = [];
PRECOS_PADRAO.forEach(function(p){ vistos[p[0].toLowerCase()] = 1; lista.push({n: p[0], v: p[1], z: p[2]}); });
nomes.forEach(function(n){ if (!vistos[n.toLowerCase()]) { vistos[n.toLowerCase()] = 1; lista.push({n: n, v: 0, z: 0}); } });
return {precos: lista, dias: {}};
}
async function publicarLista(){

return Feed.seq > ev.q;
}
function dbSalvar(d){ try { localStorage.setItem(CK, JSON.stringify(d)); } catch (e) { alert('Não consegui guardar neste celular (espaço ou modo privado).'); } }
function brl(v){ return Number(v || 0).toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'}); }
function numv(t){ var n = parseFloat(String(t).replace(/[^\d,.-]/g, '').replace(/\x2e(?=\d{3}(\D|$))/g, '').replace(',', '.')); return isFinite(n) && n >= 0 ? Math.round(n * 100) / 100 : 0; }
function precoDe(db, serv){ var k = String(serv).toLowerCase(); for (var i = 0; i < db.precos.length; i++) if (db.precos[i].n.toLowerCase() === k) return db.precos[i].v; return 0; }
function ymd(k){ return k.slice(6, 8) + '/' + k.slice(4, 6) + '/' + k.slice(0, 4); }
function registrarHoje(){
var db = dbLer(), k = dia(), dd = db.dias[k] = db.dias[k] || {itens: [], ign: []}, mudou = false;
var segs = [[]]; Feed.eventos.forEach(function(e){ if (e.k === 'r') segs.push([]); else segs[segs.length - 1].push(e); });
var tem = {}; dd.itens.forEach(function(i){ tem[i.id] = 1; }); dd.ign.forEach(function(i){ tem[i] = 1; });
segs.forEach(function(seg){ derivar(seg).tickets.forEach(function(t){ if ((t.st === 'atual' || t.st === 'atendida') && !tem[t.id]) { dd.itens.push({id: t.id, n: t.n, s: t.s, v: precoDe(db, t.s)}); tem[t.id] = 1; mudou = true; } }); });
if (mudou) dbSalvar(db);
}
function resumoMes(db, mes){
var por = {}, tot = 0, qtd = 0, dias = 0;
Object.keys(db.dias).sort().forEach(function(k){ if (k.slice(0, 6) !== mes) return; var it = db.dias[k].itens; if (it.length) dias++; it.forEach(function(i){ var o = por[i.s] = por[i.s] || {q: 0, v: 0}; o.q++; o.v += i.v; tot += i.v; qtd++; }); });
return {por: por, tot: tot, qtd: qtd, dias: dias};
}
function textoMes(db, mes){
var r = resumoMes(db, mes), l = ["Leid's designer - " + mes.slice(4, 6) + '/' + mes.slice(0, 4), 'Atendimentos: ' + r.qtd + ' em ' + r.dias + ' dia(s)', 'Faturamento: ' + brl(r.tot), ''];
Object.keys(r.por).sort().forEach(function(k){ l.push(k + ': ' + r.por[k].q + ' x, ' + brl(r.por[k].v)); });
return l.join('\n');
}
function csvMes(db, mes){
var l = ['data;senha;servico;valor'];
Object.keys(db.dias).sort().forEach(function(k){ if (k.slice(0, 6) !== mes) return; db.dias[k].itens.forEach(function(i){ l.push(ymd(k) + ';' + (i.n ? pad(i.n) : 'agenda') + ';' + String(i.s).replace(/;/g, ',') + ';' + String(i.v).replace('.', ',')); }); });
return l.join('\n');
}
function copiar(t, el){ try { navigator.clipboard.writeText(t).then(function(){ el.textContent = 'Copiado!'; }, function(){ el.textContent = 'Não copiou; selecione e copie na mão.'; }); } catch (e) { el.textContent = 'Não copiou; selecione e copie na mão.'; } }
function telaCaixa(){
if (!ehDona()) return telaPin();
Feed.limparOuvintes();
var aba = 'hoje', mes = dia().slice(0, 6);
$app.innerHTML = '<h1>Registros e preços</h1><p class="small" style="text-align:center">Só você vê esta página. Sem nomes nem telefones. Fica guardado neste celular.</p>' +
'<div class="row" style="justify-content:center"><button class="btn sec small" data-a="hoje">Hoje</button><button class="btn sec small" data-a="mes">Mês</button><button class="btn sec small" data-a="precos">Serviços</button><button class="btn sec small" data-a="backup">Backup</button></div><div id="corpo"></div>' +
'<div class="row"><a class="btn sec small" href="#/dona" style="text-decoration:none">Voltar ao painel</a></div>';
var corpo = document.getElementById('corpo');
function servicos(db){ return db.precos.map(function(p){ return p.n; }); }
function desenhar(){
var db = dbLer(), h = '';
document.querySelectorAll('[data-a]').forEach(function(b){ b.className = 'btn small' + (b.getAttribute('data-a') === aba ? '' : ' sec'); });
if (aba === 'hoje') {
var k = dia(), dd = db.dias[k] || {itens: [], ign: []}, tot = 0;
h += '<h2>Hoje, ' + ymd(k) + '</h2><p class="small">As senhas chamadas entram aqui sozinhas, com o preço da sua lista. Mude o valor se foi diferente (promoção, desconto).</p>';
h += dd.itens.length ? dd.itens.map(function(i, ix){ tot += i.v; return '<div class="item"><div><b>' + (i.n ? 'Senha ' + pad(i.n) : 'Agendada') + '</b><br><span class="small">' + esc(i.s) + '</span></div><div style="display:flex;gap:6px;align-items:center"><input data-v="' + ix + '" type="text" inputmode="decimal" value="' + String(i.v).replace('.', ',') + '" style="width:92px;padding:8px"><button class="btn sec small" data-rm="' + ix + '">x</button></div></div>'; }).join('') : '<p class="small">Nenhum atendimento registrado hoje ainda.</p>';
h += '<p class="ok">Total de hoje: <b>' + brl(tot) + '</b> · ' + dd.itens.length + ' atendimento(s)</p>';
h += '<h2>Adicionar atendimento</h2><p class="small">Para quem foi por agendamento ou não passou pela fila.</p><label>Serviço</label><select id="nsrv" style="width:100%;padding:12px;border-radius:10px;border:1px solid var(--g3);background:#0b0909;color:var(--g1);font-size:16px">' + servicos(db).map(function(n){ return '<option>' + esc(n) + '</option>'; }).join('') + '</select><label>Valor (R$)</label><input id="nval" type="text" inputmode="decimal" placeholder="Deixe vazio para usar o preço da lista"><div class="row"><button class="btn" id="nadd">Adicionar</button></div>';
} else if (aba === 'mes') {
var r = resumoMes(db, mes), meses = {};
Object.keys(db.dias).forEach(function(k){ meses[k.slice(0, 6)] = 1; }); meses[dia().slice(0, 6)] = 1;
h += '<h2>Mês</h2><select id="mes" style="width:100%;padding:12px;border-radius:10px;border:1px solid var(--g3);background:#0b0909;color:var(--g1);font-size:16px">' + Object.keys(meses).sort().reverse().map(function(m){ return '<option value="' + m + '"' + (m === mes ? ' selected' : '') + '>' + m.slice(4, 6) + '/' + m.slice(0, 4) + '</option>'; }).join('') + '</select>';
h += '<p class="ok"><b>' + r.qtd + '</b> atendimentos em ' + r.dias + ' dia(s)<br>Faturamento: <b>' + brl(r.tot) + '</b></p>';
h += Object.keys(r.por).sort().map(function(k){ return '<div class="item"><div>' + esc(k) + '</div><div>' + r.por[k].q + ' x · ' + brl(r.por[k].v) + '</div></div>'; }).join('') || '<p class="small">Sem registros neste mês.</p>';
h += '<div class="row"><button class="btn" id="cpm">Copiar resumo do mês</button><button class="btn sec" id="csv">Baixar planilha (CSV)</button></div><p class="small" id="mmsg"></p><textarea id="tmes" readonly rows="6" style="width:100%;background:#0b0909;color:var(--g1);border:1px solid var(--g3);border-radius:10px;padding:10px">' + esc(textoMes(db, mes)) + '</textarea>';
} else if (aba === 'precos') {
var pub = listaPublicada(Feed.eventos);
h += '<h2>Serviços e valores</h2><p class="small">As clientes veem esta lista na tela delas. Só você edita. Marque "pelo WhatsApp" para mostrar esse texto no lugar do preço. Serviço com valor 0 e sem a marca fica escondido das clientes. Os valores também alimentam o faturamento.</p>';
h += db.precos.map(function(p, ix){ return '<div class="item" style="flex-wrap:wrap"><input data-pn="' + ix + '" type="text" value="' + esc(p.n) + '" style="flex:1 1 150px;padding:8px"><input data-pv="' + ix + '" type="text" inputmode="decimal" value="' + String(p.v).replace('.', ',') + '" style="width:90px;padding:8px"><label style="margin:0;display:flex;gap:6px;align-items:center"><input type="checkbox" data-pz="' + ix + '"' + (p.z ? ' checked' : '') + '> pelo WhatsApp</label><button class="btn sec small" data-prm="' + ix + '">x</button></div>'; }).join('');
h += '<div class="row"><button class="btn sec" id="padd">Adicionar serviço</button></div><div class="row"><button class="btn" id="ppub">Salvar e publicar para as clientes</button></div><p class="small" id="pmsg">' + (pub ? 'Lista publicada hoje.' : 'Ainda não publicada hoje: as clientes veem só a lista padrão.') + '</p><p class="small">A lista publicada vale só para o dia (a fila zera todo dia). Ao abrir o painel, ela é publicada sozinha. Preço novo vale para os próximos atendimentos registrados; os já registrados mantêm o valor.</p>';
} else {
h += '<h2>Backup</h2><p class="small"><b>Importante:</b> os registros ficam só neste celular. Se você limpar os dados do navegador, trocar de celular ou usar outro navegador, eles somem. Copie o backup uma vez por semana e guarde no WhatsApp (conversa com você mesma) ou e-mail.</p><div class="row"><button class="btn" id="bk">Copiar backup</button></div><p class="small" id="bmsg"></p><label>Restaurar backup (cole aqui)</label><textarea id="bkin" rows="4" style="width:100%;background:#0b0909;color:var(--g1);border:1px solid var(--g3);border-radius:10px;padding:10px"></textarea><div class="row"><button class="btn sec" id="rest">Restaurar</button></div>';
}
corpo.innerHTML = h;
}
document.querySelectorAll('[data-a]').forEach(function(b){ b.onclick = function(){ aba = b.getAttribute('data-a'); desenhar(); }; });
corpo.addEventListener('change', function(e){
var db = dbLer(), t = e.target, k = dia(), dd = db.dias[k] || (db.dias[k] = {itens: [], ign: []});
if (t.id === 'mes') { mes = t.value; desenhar(); return; }
if (t.hasAttribute('data-v')) { dd.itens[+t.getAttribute('data-v')].v = numv(t.value); dbSalvar(db); desenhar(); }
else if (t.hasAttribute('data-pn')) { db.precos[+t.getAttribute('data-pn')].n = t.value.trim() || db.precos[+t.getAttribute('data-pn')].n; dbSalvar(db); }
else if (t.hasAttribute('data-pz')) { db.precos[+t.getAttribute('data-pz')].z = t.checked ? 1 : 0; dbSalvar(db); }
else if (t.hasAttribute('data-pv')) { db.precos[+t.getAttribute('data-pv')].v = numv(t.value); dbSalvar(db); desenhar(); }
});
corpo.addEventListener('click', function(e){
var db = dbLer(), t = e.target.closest('button'); if (!t) return; var k = dia(), dd = db.dias[k] || (db.dias[k] = {itens: [], ign: []});
if (t.hasAttribute('data-rm')) { var it = dd.itens.splice(+t.getAttribute('data-rm'), 1)[0]; if (it) dd.ign.push(it.id); dbSalvar(db); desenhar(); }
else if (t.id === 'nadd') { var sv = document.getElementById('nsrv').value, vv = document.getElementById('nval').value.trim(); dd.itens.push({id: 'm' + codigo(), n: 0, s: sv, v: vv ? numv(vv) : precoDe(db, sv)}); dbSalvar(db); desenhar(); }
else if (t.id === 'ppub') { t.disabled = true; document.getElementById('pmsg').textContent = 'Publicando...'; publicarLista().then(function(ok){ t.disabled = false; document.getElementById('pmsg').textContent = ok ? 'Publicado. As clientes já veem.' : 'Não foi aceito. Atualize e tente de novo.'; }).catch(function(){ t.disabled = false; document.getElementById('pmsg').textContent = 'Não consegui publicar. Confira a internet.'; }); }
else if (t.id === 'padd') { db.precos.push({n: 'Novo serviço', v: 0, z: 0}); dbSalvar(db); desenhar(); }
else if (t.hasAttribute('data-prm')) { if (confirm('Tirar este serviço da lista?')) { db.precos.splice(+t.getAttribute('data-prm'), 1); dbSalvar(db); desenhar(); } }
else if (t.id === 'cpm') copiar(textoMes(db, mes), document.getElementById('mmsg'));
else if (t.id === 'csv') { try { var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff' + csvMes(db, mes)], {type: 'text/csv'})); a.download = 'registros-' + mes + '.csv'; document.body.appendChild(a); a.click(); a.remove(); } catch (x) { document.getElementById('mmsg').textContent = 'Não consegui baixar. Use "Copiar resumo".'; } }
else if (t.id === 'bk') copiar(JSON.stringify(db), document.getElementById('bmsg'));
else if (t.id === 'rest') { try { var n = JSON.parse(document.getElementById('bkin').value); if (!n || !n.dias || !n.precos) throw 0; if (confirm('Isto troca os registros e preços deste celular pelos do backup. Continuar?')) { dbSalvar(n); aba = 'hoje'; desenhar(); } } catch (x) { alert('Backup inválido.'); } }
});
Feed.ouvir(function(){ registrarHoje(); if (aba === 'hoje' && !corpo.contains(document.activeElement)) desenhar(); });
Feed.iniciar(); registrarHoje(); desenhar();
}
function render(){
var h = location.hash.replace(/^#/, '') || '/';
var m = h.match(/^\/senha\/(\d+)/);
if (m) return telaStatus(parseInt(m[1], 10));
if (h === '/dona') return telaDona();
if (h === '/dona/caixa') return telaCaixa();
if (h === '/gerar') return telaGerar();
var minha = minhaSenha();
if (h === '/' && minha) { location.replace('#/senha/' + pad(minha.n)); return; }
telaPegar();
}
window.addEventListener('hashchange', render);
document.getElementById('foot').innerHTML = 'Sem nome nem telefone: a fila usa só o número da senha.<br><a href="#/dona">Sou a Leidi</a>';
render();
</script>
</body>
</html>
